name: Deploy to DirectAdmin

on:
  push:
    branches:
      - main  # Deploy on push to main branch
  workflow_dispatch:  # Allow manual trigger from GitHub UI

# Least-privilege token: this workflow only reads the repo and deploys over
# SSH. It never writes back to GitHub, so deny everything except checkout read.
permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        # Pinned to a commit SHA (not a mutable tag) so a compromised/moved
        # tag cannot silently change what runs. SHA = actions/checkout v4.3.1.
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      # SECURITY: the previous "Setup Node.js" + "npm install" steps were
      # removed. `npm install` runs arbitrary lifecycle scripts (preinstall/
      # postinstall/prepare) for the entire dependency tree in the SAME job
      # that later loads SSH_PRIVATE_KEY — a compromised dependency could
      # exfiltrate the prod deploy key. The built node_modules was never used:
      # it is excluded from the rsync, DirectAdmin manages node_modules on the
      # server, and no test step runs here. Re-add only as a SECRET-FREE
      # validate job (npm ci --ignore-scripts) if CI testing returns.

      - name: Fail on deployable symlinks
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t symlinks < <(git ls-files -s | awk '$1 == "120000" { print $4 }')

          if [ ${#symlinks[@]} -eq 0 ]; then
            echo "No tracked symlinks found."
            exit 0
          fi

          echo "Tracked symlinks found:"
          printf '  %s\n' "${symlinks[@]}"

          is_excluded_symlink() {
            case "$1" in
              data|data/*)
                return 0
                ;;
              views/nickerson|views/nickerson/*)
                return 0
                ;;
              views/layouts/nickerson.handlebars)
                return 0
                ;;
              public/css/nickerson|public/css/nickerson/*|public/css/nickerson.css)
                return 0
                ;;
              public/js/debug-sidebar.js|public/js/param-sidebar.js|public/js/nickerson-scenarios.js|public/js/tooltip-sidebar.js)
                return 0
                ;;
              public/js/nickerson|public/js/nickerson/*)
                return 0
                ;;
              scripts/NickersonCallbacks.js|dbcon_nickerson.js|Nickerson.js)
                return 0
                ;;
              *)
                return 1
                ;;
            esac
          }

          deployable_symlinks=()
          for path in "${symlinks[@]}"; do
            if ! is_excluded_symlink "$path"; then
              deployable_symlinks+=("$path")
            fi
          done

          if [ ${#deployable_symlinks[@]} -gt 0 ]; then
            echo "ERROR: tracked symlinks in deployable paths are not allowed."
            echo "Materialize these files before deploying:"
            printf '  %s\n' "${deployable_symlinks[@]}"
            exit 1
          fi

          echo "Only excluded/private-overlay symlinks are present."
      
      # Skip tests for now - no test suite implemented yet
      # - name: Run tests
      #   run: npm test --if-present
      
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${{ secrets.SSH_PORT }} -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts || true
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Clean stale server-side backup directories
        run: |
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i ~/.ssh/deploy_key \
            -p ${{ secrets.SSH_PORT }} \
            ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} \
            "find ${{ secrets.DEPLOY_PATH }} -maxdepth 1 -type d -name 'node_modules.backup-*' -exec rm -rf {} + 2>/dev/null || true"
      
      - name: Deploy files via rsync
        run: |
          rsync -avz --delete \
            -e "ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i ~/.ssh/deploy_key -p ${{ secrets.SSH_PORT }}" \
            --exclude='.git' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='.vs' \
            --exclude='.vscode' \
            --exclude='*.log' \
            --exclude='logs/' \
            --exclude='tmp/' \
            --exclude='.github' \
            --exclude='github-deploy-key*' \
            --exclude='node_modules' \
            --exclude='package-lock.json' \
            --exclude='Nickerson.js' \
            --exclude='dbcon_nickerson.js' \
            --exclude='dbcon_nickerson.local.js' \
            --exclude='scripts/NickersonCallbacks.js' \
            --exclude='scripts/_*.js' \
            --exclude='scripts/constants.js' \
            --exclude='scripts/migrate.js' \
            --exclude='scripts/capture-baselines.js' \
            --exclude='scripts/verify-all-baselines.js' \
            --exclude='scripts/add-medical-base-monthly-column.js' \
            --exclude='scripts/add-condo-basis-column.js' \
            --exclude='scripts/check-scenarios.js' \
            --exclude='scripts/check-schema.js' \
            --exclude='scripts/delete-zombie-scenarios.js' \
            --exclude='scripts/verify-depreciation-fix.js' \
            --exclude='migrations' \
            --exclude='views/nickerson' \
            --exclude='views/layouts/nickerson.handlebars' \
            --exclude='views/partials/tooltip-sidebar.handlebars' \
            --exclude='views/partials/param-sidebar.handlebars' \
            --exclude='data' \
            --exclude='tests' \
            --exclude='openspec' \
            --exclude='public/js/nickerson' \
            --exclude='public/js/debug-sidebar.js' \
            --exclude='public/js/param-sidebar.js' \
            --exclude='public/js/nickerson-scenarios.js' \
            --exclude='public/js/tooltip-sidebar.js' \
            --exclude='public/css/nickerson' \
            --exclude='public/css/nickerson.css' \
            --exclude='data' \
            --exclude='skills-lock.json' \
            --exclude='.agents' \
            --exclude='.claude' \
            ./ ${{ secrets.SSH_USERNAME}}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}/
      
      # Remove any .env file on server to ensure DirectAdmin env vars are used
      - name: Remove .env file from server
        run: |
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i ~/.ssh/deploy_key \
            -p ${{ secrets.SSH_PORT }} \
            ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} \
            "cd ${{ secrets.DEPLOY_PATH }} && rm -f .env && echo '.env file removed if it existed'"
      
      # DirectAdmin handles node_modules, skip manual npm install
      # - name: Install production dependencies
      #   run: |
      #     ssh -i ~/.ssh/deploy_key \
      #       -p ${{ secrets.SSH_PORT }} \
      #       ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} \
      #       "source ~/.nvm/nvm.sh && cd ${{ secrets.DEPLOY_PATH }} && npm ci --production"
      
      - name: Restart Node.js application
        run: |
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i ~/.ssh/deploy_key \
            -p ${{ secrets.SSH_PORT }} \
            ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} \
            "cd ${{ secrets.DEPLOY_PATH }} && touch tmp/restart.txt || (mkdir -p tmp && touch tmp/restart.txt)"
      
      - name: Verify deployment
        run: |
          echo "Deployment completed successfully!"
          echo "Check your site at: https://realfeygon.com"
      
      - name: Cleanup SSH keys
        if: always()
        run: rm -f ~/.ssh/deploy_key
